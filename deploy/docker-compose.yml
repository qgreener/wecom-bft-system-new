services:
  mysql:
    image: mysql:8.4
    container_name: wecom-bft-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]

  redis:
    image: redis:7.4
    container_name: wecom-bft-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: wecom-bft-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: ["server", "/data", "--console-address", ":9001"]

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: wecom-bft-backend
    env_file:
      - ./env/.env.example
    depends_on:
      - mysql
      - redis
      - minio
    ports:
      - "8080:8080"

  nginx:
    image: nginx:1.27-alpine
    container_name: wecom-bft-nginx
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/wecom-bft.conf.template:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/admin/dist:/usr/share/nginx/html/admin:ro
      - ../frontend/h5/wecom-sidebar/dist:/usr/share/nginx/html/h5/wecom-sidebar:ro
      - ../frontend/h5/supplier/dist:/usr/share/nginx/html/h5/supplier:ro
      - ../frontend/h5/lead/dist:/usr/share/nginx/html/h5/lead:ro

volumes:
  mysql-data:
  redis-data:
  minio-data:
