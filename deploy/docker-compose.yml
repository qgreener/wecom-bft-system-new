# =============================================================================
# Phase E 部署编排（HTTP 阶段；HTTPS 在 deploy/README.md 第 5 步补充）
# 用法：
#   cd deploy && cp .env.production.example .env
#   编辑 .env 填入真实凭据
#   docker compose --env-file .env up -d --build
# =============================================================================
name: wecom-bft

services:
  mysql:
    image: mysql:8.4
    container_name: wecom-bft-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks:
      - wecom-bft-net

  redis:
    image: redis:7.4-alpine
    container_name: wecom-bft-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks:
      - wecom-bft-net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: wecom-bft-backend:latest
    container_name: wecom-bft-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8080
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USERNAME: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      APP_ENV: ${APP_ENV}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL}
      APP_CALLBACK_PUBLIC_BASE_URL: ${APP_CALLBACK_PUBLIC_BASE_URL}
      APP_MAINTENANCE_MODE: ${APP_MAINTENANCE_MODE}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED}
      INTEGRATION_DEFAULT_MODE: ${INTEGRATION_DEFAULT_MODE}
      INTEGRATION_PAYMENT_MODE: ${INTEGRATION_PAYMENT_MODE}
      INTEGRATION_REFUND_MODE: ${INTEGRATION_REFUND_MODE}
      INTEGRATION_LOGISTICS_MODE: ${INTEGRATION_LOGISTICS_MODE}
      INTEGRATION_INVOICE_MODE: ${INTEGRATION_INVOICE_MODE}
      INTEGRATION_WECOM_MODE: ${INTEGRATION_WECOM_MODE}
      INTEGRATION_MESSAGE_MODE: ${INTEGRATION_MESSAGE_MODE}
      INTEGRATION_WECOM_AUTH_MODE: ${INTEGRATION_WECOM_AUTH_MODE}
      INTEGRATION_WECHAT_MINIAPP_AUTH_MODE: ${INTEGRATION_WECHAT_MINIAPP_AUTH_MODE}
      WECOM_CORP_ID: ${WECOM_CORP_ID}
      WECOM_AGENT_ID: ${WECOM_AGENT_ID}
      WECOM_AGENT_SECRET: ${WECOM_AGENT_SECRET}
      WECOM_OAUTH_REDIRECT_URI: ${WECOM_OAUTH_REDIRECT_URI}
      WECOM_CALLBACK_TOKEN: ${WECOM_CALLBACK_TOKEN:-}
      WECOM_CALLBACK_AES_KEY: ${WECOM_CALLBACK_AES_KEY:-}
      WECOM_APPROVAL_TEMPLATE_ID: ${WECOM_APPROVAL_TEMPLATE_ID:-}
      WECOM_APPROVAL_TITLE_CONTROL_ID: ${WECOM_APPROVAL_TITLE_CONTROL_ID:-}
      WECOM_APPROVAL_DESC_CONTROL_ID: ${WECOM_APPROVAL_DESC_CONTROL_ID:-}
      WECHAT_MINIAPP_APP_ID: ${WECHAT_MINIAPP_APP_ID}
      WECHAT_MINIAPP_APP_SECRET: ${WECHAT_MINIAPP_APP_SECRET}
      WECHAT_MINIAPP_CODE2SESSION_URL: ${WECHAT_MINIAPP_CODE2SESSION_URL}
      FILE_STORAGE_TYPE: ${FILE_STORAGE_TYPE}
      FILE_UPLOAD_BASE_PATH: ${FILE_UPLOAD_BASE_PATH}
      FILE_MAX_UPLOAD_SIZE_MB: ${FILE_MAX_UPLOAD_SIZE_MB}
      TZ: Asia/Shanghai
    volumes:
      - backend-storage:${FILE_UPLOAD_BASE_PATH}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wecom-bft-net

  nginx:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    image: wecom-bft-nginx:latest
    container_name: wecom-bft-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # 直接挂主机 /etc/letsencrypt（certbot 已签发的证书在那里）
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot
    depends_on:
      - backend
    networks:
      - wecom-bft-net

  certbot:
    image: certbot/certbot:latest
    container_name: wecom-bft-certbot
    profiles: ["cert"]
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot

networks:
  wecom-bft-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  backend-storage:
  certbot-www:
