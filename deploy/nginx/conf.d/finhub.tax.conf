# =============================================================================
# Phase E：HTTP 80 → 强制跳 HTTPS 443；HTTPS 提供完整服务
# 证书：主机 /etc/letsencrypt 已签发（容器只读挂载）
# =============================================================================

upstream backend_upstream {
    server backend:8080;
}

# HTTP 80 - 跳转 HTTPS（保留 ACME challenge）
server {
    listen 80;
    listen [::]:80;
    server_name finhub.tax www.finhub.tax;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 443 - 主服务
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name finhub.tax www.finhub.tax;

    ssl_certificate     /etc/letsencrypt/live/finhub.tax/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finhub.tax/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Security headers（基础版本，演示用够）
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 25m;

    # 默认根路径 → 管理端登录
    location = / {
        return 302 /admin/;
    }

    # /api/* → 后端
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 管理端静态资源
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "public, max-age=300";
    }

    # 公开留资 H5
    location /h5/lead/ {
        alias /usr/share/nginx/html/h5/lead/;
        try_files $uri $uri/ /h5/lead/index.html;
        add_header Cache-Control "public, max-age=300";
    }

    # 供货商 H5
    location /h5/supplier/ {
        alias /usr/share/nginx/html/h5/supplier/;
        try_files $uri $uri/ /h5/supplier/index.html;
        add_header Cache-Control "public, max-age=300";
    }

    # 企微侧边栏 H5
    location /h5/wecom-sidebar/ {
        alias /usr/share/nginx/html/h5/wecom-sidebar/;
        try_files $uri $uri/ /h5/wecom-sidebar/index.html;
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        return 404;
    }
}
