spring:
  datasource:
    url: jdbc:h2:mem:wecom_bft_test;MODE=MySQL;DATABASE_TO_UPPER=false;CASE_INSENSITIVE_IDENTIFIERS=true
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  main:
    banner-mode: off

app:
  name: wecom-bft-new-system
  version: 0.1.0-test
  environment: test
  maintenance-mode: false

integration:
  default-mode: mock
  payment-mode: mock
  refund-mode: mock
  logistics-mode: mock
  invoice-mode: mock
  wecom-mode: mock
  message-mode: mock
  wecom-auth-mode: mock
  wechat-miniapp-auth-mode: mock

wecom:
  corp-id: TEST_CORP_ID
  agent-id: TEST_AGENT_ID
  agent-secret: TEST_AGENT_SECRET
  oauth-redirect-uri: http://localhost/api/admin/auth/wecom-oauth/callback

wechat:
  miniapp:
    app-id: TEST_APP_ID
    app-secret: TEST_APP_SECRET
    code2session-url: https://api.weixin.qq.com/sns/jscode2session

logging:
  level:
    root: WARN
